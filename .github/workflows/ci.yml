name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Lint Python
        run: ruff check backend/app backend/tests
      - name: Check Python formatting
        run: ruff format --check backend/app backend/tests
      - name: Type check
        run: mypy backend/app
      - name: Check JavaScript syntax
        run: find frontend -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test with branch coverage
        run: pytest --cov=backend/app --cov-branch --cov-report=term-missing

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install security tools
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Audit dependencies
        run: pip-audit -r backend/requirements.txt --strict
      - name: Scan Python source
        run: bandit -q -r backend/app -ll -ii
