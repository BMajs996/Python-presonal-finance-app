name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: finance_dashboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finance -d finance_dashboard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://finance:ci-test-only@127.0.0.1:5432/finance_dashboard_test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Install frontend dependencies
        run: npm ci
      - name: Verify vendored charts
        run: |
          npm run vendor:charts
          git diff --exit-code -- frontend/vendor
      - name: Frontend unit tests
        run: npm test
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser workflows
        run: npm run test:e2e
      - name: PostgreSQL browser workflows
        run: npm run test:e2e
        env:
          E2E_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-diagnostics
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - name: Lint Python
        run: ruff check backend/app backend/tests tests/e2e/server.py
      - name: Check Python formatting
        run: ruff format --check backend/app backend/tests tests/e2e/server.py
      - name: Type check
        run: mypy backend/app
      - name: Check JavaScript syntax
        run: find frontend -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Test with branch coverage
        run: pytest --cov=backend/app --cov-branch --cov-report=term-missing

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install security tools
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Audit dependencies
        run: pip-audit -r backend/requirements.txt --strict
      - name: Scan Python source
        run: bandit -q -r backend/app -ll -ii
