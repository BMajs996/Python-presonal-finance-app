<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in | Finance Dashboard</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="login-page">
  <main class="login-main">
    <p class="eyebrow">Personal Finance</p>
    <h1>Sign in</h1>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" maxlength="100" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="1024" required>
      <p id="login-error" class="login-error" role="alert" aria-live="polite"></p>
      <button id="login-submit" class="primary" type="submit">Sign in</button>
    </form>
  </main>
  <script type="module" src="/assets/login.js"></script>
</body>
</html>
