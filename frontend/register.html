<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create account | Finance Dashboard</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="login-page">
  <main class="login-main">
    <p class="eyebrow">Personal Finance</p>
    <h1>Create account</h1>
    <form id="account-form" data-action="register">
      <label for="display-name">Name</label>
      <input id="display-name" name="display_name" autocomplete="name" maxlength="100" required>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" minlength="3" maxlength="50" pattern="[a-zA-Z0-9][a-zA-Z0-9._-]*" required>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
      <label for="phone">Phone (international)</label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="16" placeholder="+381641234567" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="15" maxlength="1024" required>
      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" name="confirmation" type="password" autocomplete="new-password" minlength="15" maxlength="1024" required>
      <p id="account-error" class="login-error" role="alert" aria-live="polite"></p>
      <button id="account-submit" class="primary" type="submit">Create account</button>
      <a href="/login">Sign in</a>
    </form>
  </main>
  <script type="module" src="/assets/account-access.js"></script>
</body>
</html>
