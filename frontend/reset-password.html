<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Reset password | Finance Dashboard</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body class="login-page">
  <main class="login-main">
    <p class="eyebrow">Personal Finance</p>
    <h1>Reset password</h1>
    <form id="account-form" data-action="reset-password">
      <label for="password">New password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" minlength="15" maxlength="1024" required>
      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" name="confirmation" type="password" autocomplete="new-password" minlength="15" maxlength="1024" required>
      <p id="account-error" class="login-error" role="alert" aria-live="polite"></p>
      <button id="account-submit" class="primary" type="submit">Reset password</button>
      <a href="/login">Sign in</a>
    </form>
  </main>
  <script type="module" src="/assets/account-access.js"></script>
</body>
</html>
